name: Build mod jar

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.1.1
      - run: gradle build --no-daemon
      - name: Prepare jar
        run: |
          JAR=$(ls build/libs/*.jar | grep -v sources | head -1)
          cp "$JAR" orbitalstrike.jar
          ls -la orbitalstrike.jar
      - uses: actions/upload-artifact@v4
        with:
          name: orbitalstrike-jar
          path: build/libs/*.jar
      - name: Publish to the "latest" release (direct download link)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "Latest build" --notes "Download orbitalstrike.jar and put it in your mods folder (Forge 1.20.1)."
          gh release upload latest orbitalstrike.jar --clobber
          gh release edit latest --notes "Latest build from commit ${GITHUB_SHA::7}. Download orbitalstrike.jar and put it in your mods folder (Forge 1.20.1)."
